name: Publish signed APT repository

on:
  repository_dispatch:
    types: [opscope-release]
  # Monthly on the 1st at 19:30 Asia/Taipei (11:30 UTC).
  # Metadata expires after 90 days.
  # This never discovers or imports new versions.
  schedule:
    - cron: '30 11 1 * *'
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options: [opscope]
        default: opscope
        required: true
      tag:
        description: 'Exact published stable tag, e.g. v1.2.3'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: apt-publication
  cancel-in-progress: false

jobs:
  publish:
    # Run every configured event on main; publishing protection belongs to
    # the apt-publishing environment and the signing/verification steps.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: apt-publishing
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Restore immutable package history
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote="https://github.com/${REPOSITORY}.git"
          refs=$(git ls-remote --heads "$remote" refs/heads/apt-state)
          if [ -n "$refs" ]; then
            git clone --single-branch --branch apt-state "$remote" site
          else
            mkdir site
            git -C site init -b apt-state
            git -C site remote add origin "$remote"
          fi
      - name: Import the exact dispatched release or refresh existing indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prepare.py
      - name: Sign and verify using the approved key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: python3 scripts/repository.py sign
      - name: Verify signed APT installation and upgrades
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 debian:12; do
            docker run --rm -v "$PWD/site:/repo:ro" -v "$PWD/tests:/tests:ro" \
              "$image" bash /tests/lifecycle.sh
          done
      - name: Persist complete snapshot for retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add pool dists stealth-factory.asc .nojekyll
          git -C site commit -m 'chore: refresh signed APT snapshot'
          # No force push. Concurrent external changes fail rather than lose
          # another application's packages. The next run restores that state.
          git -C site -c credential.helper='!gh auth git-credential' push origin HEAD:apt-state
          rm -rf site/.git
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Preserve .nojekyll; v5 excludes hidden files by default.
          include-hidden-files: true
      - name: Deploy the verified snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
